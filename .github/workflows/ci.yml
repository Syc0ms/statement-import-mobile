name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix app

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Kit tests (node --test) and client tests (Jest, against the real kit mock)
      - name: Tests
        run: npm test
